# ============================================================================
# ai-edges.yaml — typed relationships between concepts in ai-nodes.yaml
# ============================================================================
#
# Each edge: { source, target, type, notes? }
#   - source / target : kebab-case node ids that MUST exist in ai-nodes.yaml
#   - type            : one of the 6 closed-set edge types (see import-yaml.ts)
#   - notes           : one-line human rationale (not imported into the graph)
#
# Edge types and DIRECTION CONVENTIONS (source --type--> target):
#   descendant-of        source is a later / derived form of target   (newer -> ancestor)
#   substrate-of         source rests on target's mathematical substrate (method -> substrate)
#   composes             source is a building block of target framework (part -> whole)
#   uses                 source uses target as a component / subroutine  (user -> used)
#   prerequisite         source is a conceptual prerequisite of target   (foundation -> dependent)
#   historical-influence source historically influenced / preceded target (older -> newer)
# ============================================================================

edges:

