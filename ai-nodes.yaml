# AI Taxonomy — Node Catalog
# Version: 0.1.0
# Purpose: Atomic node content for a user-built "brain map" graph of AI/statistic-AI components.
# Edges are deliberately omitted — graph structure is the user's design choice.
#
# Schema:
#   id          : kebab-case slug, stable identifier
#   name        : canonical display name
#   aliases     : optional list of common alternative names
#   branch      : top-level grouping (for filtering / colour, not edges)
#   type        : algorithm | method | model-class | system | framework | math-construct
#   era         : year or decade of significant introduction
#   status      : foundational | active | legacy | emerging | dormant
#   descriptor  : one technical sentence
#   anchors     : list of concrete deployments / verifiable uses
#
# Branches:
#   symbolic-gofai
#   classical-ml
#   deep-learning
#   reinforcement-learning
#   hybrid-neurosymbolic
#   substrate-statistics
#   substrate-optimization
#   substrate-information-theory
#   substrate-signal-processing
#   information-retrieval-recommenders
#   cross-cutting

nodes:
  # ==================== SYMBOLIC / GOFAI ====================

  - id: symbolic-gofai
    name: Symbolic AI
    aliases: [GOFAI, Good Old-Fashioned AI, Classical AI]
    branch: symbolic-gofai
    type: framework
    era: 1956-present
    status: active
    descriptor: AI based on explicit symbolic representations and rule-based manipulation; dominant paradigm from Dartmouth conference through the late 1980s, still active in verification and reasoning.
    anchors:
      [
        AWS formal verification of cryptography,
        Lean ecosystem,
        compiler optimizations,
      ]

  - id: knowledge-representation
    name: Knowledge Representation
    aliases: [KR]
    branch: symbolic-gofai
    type: framework
    era: 1960s-present
    status: active
    descriptor: Encoding what is known about a domain in a form usable for inference; covers ontologies, frames, semantic networks, description logics.
    anchors: [biomedical ontologies SNOMED-CT, Wikidata, schema.org]

  - id: ontologies
    name: Ontologies
    branch: symbolic-gofai
    type: method
    era: 1980s-present
    status: active
    descriptor: Formal specification of concepts, classes, and relations in a domain; backbone of structured knowledge systems.
    anchors: [Cyc, WordNet, Gene Ontology]

  - id: semantic-web
    name: Semantic Web
    branch: symbolic-gofai
    type: framework
    era: 2001-present
    status: active
    descriptor: Web of machine-readable data using RDF triples, OWL ontologies, SPARQL queries; W3C standards stack.
    anchors: [DBpedia, Wikidata, schema.org markup]

  - id: knowledge-graphs
    name: Knowledge Graphs
    branch: symbolic-gofai
    type: method
    era: 2012-present
    status: active
    descriptor: Entity-relation graph stores combining ontology, instance data, and reasoning; popularized by Google KG.
    anchors:
      [Google Knowledge Graph, Facebook Open Graph, enterprise KGs in pharma]

  - id: logic-programming
    name: Logic Programming
    branch: symbolic-gofai
    type: framework
    era: 1972-present
    status: legacy
    descriptor: Programs as logical clauses, computation as proof-search; SLD-resolution.
    anchors: [Prolog, Datalog in datalog-rs and Soufflé for static analysis]

  - id: expert-systems
    name: Expert Systems
    aliases: [Rule-Based Systems]
    branch: symbolic-gofai
    type: framework
    era: 1970s-1980s
    status: legacy
    descriptor: Rule-engine systems encoding human-expert heuristics; commercial peak in the 1980s, still embedded in business-rules engines.
    anchors: [Drools, IBM ODM, residual use in insurance underwriting]

  - id: mycin
    name: MYCIN
    branch: symbolic-gofai
    type: system
    era: 1972-1980
    status: legacy
    descriptor: Stanford expert system for diagnosing bacterial infections; introduced certainty factors and rule-based explanation.
    anchors:
      [
        Stanford Heuristic Programming Project,
        archetype of medical expert systems,
      ]

  - id: watson-jeopardy
    name: IBM Watson (Jeopardy)
    branch: symbolic-gofai
    type: system
    era: 2011
    status: legacy
    descriptor: Hybrid IR + parsing + scoring system that won Jeopardy in 2011; mostly symbolic with statistical components.
    anchors: [IBM Watson Jeopardy match Feb 2011]

  - id: automated-reasoning
    name: Automated Reasoning
    branch: symbolic-gofai
    type: framework
    era: 1960s-present
    status: active
    descriptor: Computer-assisted proof of logical statements; covers theorem proving, SAT/SMT, model checking.
    anchors: [seL4 microkernel verification, CompCert verified C compiler]

  - id: theorem-provers
    name: Interactive Theorem Provers
    aliases: [Proof Assistants, ITPs]
    branch: symbolic-gofai
    type: system
    era: 1970s-present
    status: active
    descriptor: Tools for constructing machine-checked formal proofs using dependent type theory or higher-order logic.
    anchors: [Lean 4, Coq/Rocq, Isabelle/HOL, Agda]

  - id: sat-smt-solvers
    name: SAT / SMT Solvers
    branch: symbolic-gofai
    type: algorithm
    era: 1960s-present
    status: active
    descriptor: Decision procedures for Boolean satisfiability and satisfiability modulo theories; backbone of formal verification.
    anchors:
      [
        Z3,
        CVC5,
        MiniSat,
        used in symbolic execution and compiler test generation,
      ]

  - id: planning-classical
    name: Classical Planning
    branch: symbolic-gofai
    type: framework
    era: 1971-present
    status: active
    descriptor: Generating action sequences to achieve goals in deterministic discrete domains; STRIPS lineage.
    anchors: [NASA Deep Space 1 Remote Agent, manufacturing scheduling]

  - id: pddl
    name: PDDL
    aliases: [Planning Domain Definition Language]
    branch: symbolic-gofai
    type: framework
    era: 1998-present
    status: active
    descriptor: Standard language for specifying planning problems; lingua franca of the International Planning Competition.
    anchors: [International Planning Competition, NASA mission planning]

  - id: htn-planning
    name: Hierarchical Task Network Planning
    aliases: [HTN]
    branch: symbolic-gofai
    type: algorithm
    era: 1970s-present
    status: active
    descriptor: Planning by decomposing tasks into subtasks via predefined methods.
    anchors:
      [game AI in Killzone and Horizon Zero Dawn, military logistics planners]

  - id: classical-search
    name: Classical Search
    branch: symbolic-gofai
    type: framework
    era: 1950s-present
    status: foundational
    descriptor: Uninformed and informed search over state spaces; BFS, DFS, IDS, best-first, A*, IDA*.
    anchors: [puzzle solvers, route planners, every undergraduate AI course]

  - id: a-star
    name: A* Search
    branch: symbolic-gofai
    type: algorithm
    era: 1968
    status: foundational
    descriptor: Best-first graph search using f(n) = g(n) + h(n); optimal and complete when h is admissible.
    anchors: [Google Maps routing, video-game pathfinding, robot navigation]

  - id: dijkstra
    name: Dijkstra's Algorithm
    branch: symbolic-gofai
    type: algorithm
    era: 1956
    status: foundational
    descriptor: Single-source shortest paths in non-negative weighted graphs; special case of A* with h=0.
    anchors: [OSPF link-state routing, network protocols, baseline pathfinding]

  - id: minimax-alpha-beta
    name: Minimax with Alpha-Beta Pruning
    branch: symbolic-gofai
    type: algorithm
    era: 1950s-1960s
    status: foundational
    descriptor: Adversarial game-tree search with pruning of provably-dominated branches.
    anchors:
      [
        Stockfish chess engine,
        Deep Blue defeating Kasparov 1997,
        classical board-game AIs,
      ]

  - id: mcts
    name: Monte Carlo Tree Search
    aliases: [MCTS, UCT]
    branch: symbolic-gofai
    type: algorithm
    era: 2006
    status: active
    descriptor: Tree search guided by random rollouts and the UCB1 selection rule; revolutionized computer Go before deep learning.
    anchors:
      [
        MoGo and Crazy Stone Go programs,
        AlphaGo combined MCTS with neural networks,
      ]

  - id: constraint-satisfaction
    name: Constraint Satisfaction Problems
    aliases: [CSP]
    branch: symbolic-gofai
    type: framework
    era: 1970s-present
    status: active
    descriptor: Finding variable assignments that satisfy a set of constraints; backtracking with arc consistency.
    anchors: [Sudoku solvers, timetabling, n-queens, Google OR-Tools]

  - id: cognitive-architectures
    name: Cognitive Architectures
    branch: symbolic-gofai
    type: framework
    era: 1980s-present
    status: dormant
    descriptor: Unified computational models of mind aiming to integrate perception, memory, reasoning, learning.
    anchors: [SOAR, ACT-R used in HCI and education research]

  - id: fuzzy-logic
    name: Fuzzy Logic
    branch: symbolic-gofai
    type: framework
    era: 1965-present
    status: legacy
    descriptor: Multivalued logic with degrees of truth in [0,1]; pairs naturally with fuzzy control.
    anchors:
      [
        Japanese rice cookers and air conditioners,
        washing machines,
        embedded controllers,
      ]

  - id: case-based-reasoning
    name: Case-Based Reasoning
    aliases: [CBR]
    branch: symbolic-gofai
    type: framework
    era: 1980s-present
    status: legacy
    descriptor: Solving new problems by retrieving and adapting solutions from a memory of past cases.
    anchors: [helpdesk systems, early medical decision support]

  # ==================== CLASSICAL ML ====================

  - id: classical-ml
    name: Classical / Statistical Machine Learning
    branch: classical-ml
    type: framework
    era: 1990s-present
    status: active
    descriptor: Learning patterns from data with shallow models; the workhorse paradigm for tabular and structured-data problems.
    anchors: [most production ML at banks, telcos, ad-tech, Kaggle]

  - id: supervised-learning
    name: Supervised Learning
    branch: classical-ml
    type: framework
    era: 1950s-present
    status: foundational
    descriptor: Learning a mapping from inputs to labeled outputs by minimizing prediction error.
    anchors: [credit scoring, churn prediction, medical diagnosis]

  - id: linear-regression
    name: Linear Regression
    aliases: [OLS, Ordinary Least Squares]
    branch: classical-ml
    type: algorithm
    era: 1805
    status: foundational
    descriptor: Linear model fit by minimizing squared residuals; the oldest and most-used statistical method.
    anchors: [econometrics, A/B test analysis, baseline for any regression task]

  - id: logistic-regression
    name: Logistic Regression
    branch: classical-ml
    type: algorithm
    era: 1944
    status: foundational
    descriptor: Linear model with sigmoid link for binary classification; calibrated probabilities by default.
    anchors:
      [
        credit scoring,
        clinical risk scores,
        ad click-through prediction baselines,
      ]

  - id: glm
    name: Generalized Linear Models
    aliases: [GLM]
    branch: classical-ml
    type: framework
    era: 1972
    status: foundational
    descriptor: Unified framework for regression with exponential-family responses via a link function.
    anchors: [actuarial pricing, epidemiology, R's glm function]

  - id: svm
    name: Support Vector Machines
    aliases: [SVM]
    branch: classical-ml
    type: algorithm
    era: 1995
    status: active
    descriptor: Maximum-margin classifiers with the kernel trick for non-linear decision boundaries.
    anchors:
      [text classification 1990s-2010s, bioinformatics, libsvm widely embedded]

  - id: decision-trees
    name: Decision Trees
    branch: classical-ml
    type: algorithm
    era: 1984
    status: foundational
    descriptor: Recursive partitioning of feature space via greedy splits on information gain or Gini impurity.
    anchors: [CART, C4.5, ID3, building block for forests and boosting]

  - id: random-forest
    name: Random Forest
    branch: classical-ml
    type: algorithm
    era: 2001
    status: active
    descriptor: Bagged ensemble of decision trees with random feature subsampling; robust default classifier.
    anchors:
      [
        Microsoft Kinect body-part recognition,
        scikit-learn default,
        Kaggle baseline,
      ]

  - id: adaboost
    name: AdaBoost
    branch: classical-ml
    type: algorithm
    era: 1995
    status: legacy
    descriptor: Adaptive boosting; sequentially reweights training examples to focus on previously misclassified ones.
    anchors: [Viola-Jones face detector, prototypical boosting algorithm]

  - id: gradient-boosting
    name: Gradient Boosting Machines
    aliases: [GBM]
    branch: classical-ml
    type: algorithm
    era: 1999
    status: active
    descriptor: Boosting framework where each weak learner fits the gradient of the loss; underlies XGBoost, LightGBM, CatBoost.
    anchors:
      [Yandex search ranking, Microsoft Bing ranking, dominant Kaggle algorithm]

  - id: xgboost
    name: XGBoost
    branch: classical-ml
    type: framework
    era: 2014
    status: active
    descriptor: Scalable gradient-boosted-tree library with regularization, sparsity handling, parallel split-finding.
    anchors:
      [Kaggle competition wins 2015-2019, production fraud and risk models]

  - id: lightgbm
    name: LightGBM
    branch: classical-ml
    type: framework
    era: 2017
    status: active
    descriptor: Microsoft gradient-boosting library using histogram-based learning and leaf-wise growth for speed on large datasets.
    anchors: [Microsoft ad systems, production tabular ML at scale]

  - id: naive-bayes
    name: Naive Bayes
    branch: classical-ml
    type: algorithm
    era: 1960s
    status: active
    descriptor: Bayesian classifier assuming conditional independence of features given the class; strong baseline for text.
    anchors:
      [SpamAssassin and early Gmail spam filters, document categorization]

  - id: knn
    name: k-Nearest Neighbors
    aliases: [kNN]
    branch: classical-ml
    type: algorithm
    era: 1951
    status: foundational
    descriptor: Non-parametric classifier predicting the majority label among the k nearest training points.
    anchors:
      [
        recommendation baselines,
        image-search prototypes,
        foundational ML pedagogy,
      ]

  - id: unsupervised-learning
    name: Unsupervised Learning
    branch: classical-ml
    type: framework
    era: 1960s-present
    status: foundational
    descriptor: Learning structure from unlabeled data; clustering, density estimation, dimensionality reduction.
    anchors: [customer segmentation, anomaly detection, exploratory analysis]

  - id: k-means
    name: k-Means Clustering
    branch: classical-ml
    type: algorithm
    era: 1957
    status: foundational
    descriptor: Iterative partitioning into k clusters by minimizing within-cluster sum of squares.
    anchors:
      [customer segmentation, image colour quantization, vector quantization]

  - id: dbscan
    name: DBSCAN
    branch: classical-ml
    type: algorithm
    era: 1996
    status: active
    descriptor: Density-based clustering that discovers arbitrarily-shaped clusters and labels noise points.
    anchors: [geospatial clustering, anomaly-aware customer segmentation]

  - id: gmm
    name: Gaussian Mixture Models
    aliases: [GMM]
    branch: classical-ml
    type: model-class
    era: 1960s-present
    status: foundational
    descriptor: Probabilistic clustering as a weighted sum of Gaussian components fit by EM.
    anchors: [speaker verification systems pre-DL, audio segmentation]

  - id: hierarchical-clustering
    name: Hierarchical Clustering
    branch: classical-ml
    type: algorithm
    era: 1960s
    status: foundational
    descriptor: Agglomerative or divisive construction of a cluster dendrogram by successive merges or splits.
    anchors: [phylogenetic tree construction, gene-expression analysis]

  - id: spectral-clustering
    name: Spectral Clustering
    branch: classical-ml
    type: algorithm
    era: 2000s
    status: active
    descriptor: Clustering via eigenvectors of a graph Laplacian; captures non-convex cluster shapes.
    anchors: [community detection, image segmentation]

  - id: pca
    name: Principal Component Analysis
    aliases: [PCA]
    branch: classical-ml
    type: algorithm
    era: 1901
    status: foundational
    descriptor: Linear dimensionality reduction via the eigendecomposition of the covariance matrix.
    anchors:
      [
        Eigenfaces,
        exploratory data analysis,
        preprocessing for downstream models,
      ]

  - id: ica
    name: Independent Component Analysis
    aliases: [ICA]
    branch: classical-ml
    type: algorithm
    era: 1990s
    status: active
    descriptor: Decomposition into statistically independent non-Gaussian sources; the cocktail party problem.
    anchors: [EEG and fMRI artifact removal, blind source separation]

  - id: t-sne
    name: t-SNE
    aliases: [t-Distributed Stochastic Neighbor Embedding]
    branch: classical-ml
    type: algorithm
    era: 2008
    status: active
    descriptor: Non-linear dimensionality reduction preserving local neighborhood structure for 2D-3D visualization.
    anchors: [single-cell RNA-seq visualization, embedding inspection]

  - id: umap
    name: UMAP
    aliases: [Uniform Manifold Approximation and Projection]
    branch: classical-ml
    type: algorithm
    era: 2018
    status: active
    descriptor: Manifold-learning dimensionality reduction often preferred over t-SNE for speed and global structure.
    anchors: [bioinformatics single-cell analysis, embedding visualization]

  - id: pgm
    name: Probabilistic Graphical Models
    aliases: [PGM]
    branch: classical-ml
    type: framework
    era: 1980s-present
    status: active
    descriptor: Joint distributions factored according to a graph; inference via message passing or sampling.
    anchors: [biostatistics, structured prediction, robotics state estimation]

  - id: bayesian-networks
    name: Bayesian Networks
    branch: classical-ml
    type: model-class
    era: 1985
    status: active
    descriptor: Directed acyclic graphs encoding conditional independence among variables for probabilistic inference.
    anchors: [medical diagnosis systems, fault diagnosis, risk modeling]

  - id: hmm
    name: Hidden Markov Models
    aliases: [HMM]
    branch: classical-ml
    type: model-class
    era: 1960s-present
    status: legacy
    descriptor: Sequential latent-state model with discrete states and observation emissions; Viterbi and Baum-Welch.
    anchors:
      [
        pre-deep-learning speech recognition through 2010s,
        biological sequence alignment,
      ]

  - id: crf
    name: Conditional Random Fields
    aliases: [CRF]
    branch: classical-ml
    type: model-class
    era: 2001
    status: active
    descriptor: Discriminative undirected graphical models for structured prediction; the standard for NER before neural sequence models.
    anchors:
      [named entity recognition pre-DL, part-of-speech tagging, gene prediction]

  - id: lda-topic-modeling
    name: Latent Dirichlet Allocation
    aliases: [LDA]
    branch: classical-ml
    type: model-class
    era: 2003
    status: active
    descriptor: Generative probabilistic model for document collections as mixtures over latent topics.
    anchors:
      [topic discovery in news corpora, scientific literature analysis pre-LLM]

  - id: bayesian-inference-methods
    name: Bayesian Inference Methods
    branch: classical-ml
    type: framework
    era: 1763-present
    status: foundational
    descriptor: Updating posterior beliefs from priors and likelihoods; computationally realized via MCMC, VI, ABC.
    anchors: [Stan, PyMC, NumPyro, clinical trials, A/B testing platforms]

  - id: mcmc
    name: Markov Chain Monte Carlo
    aliases: [MCMC]
    branch: classical-ml
    type: algorithm
    era: 1953-present
    status: foundational
    descriptor: Family of sampling algorithms drawing from a target distribution by constructing a Markov chain with that stationary distribution.
    anchors: [Metropolis-Hastings, Gibbs, HMC and NUTS in Stan and PyMC]

  - id: variational-inference
    name: Variational Inference
    aliases: [VI]
    branch: classical-ml
    type: algorithm
    era: 1990s-present
    status: active
    descriptor: Approximate Bayesian inference by optimizing a tractable distribution to minimize KL divergence from the posterior.
    anchors: [VAEs, large-scale Bayesian neural networks, Pyro and TFP]

  - id: time-series-models
    name: Time-Series Models
    branch: classical-ml
    type: framework
    era: 1920s-present
    status: foundational
    descriptor: Models for sequential data with temporal dependence; AR, MA, ARMA, ARIMA, state-space.
    anchors: [econometric forecasting, demand forecasting, sensor monitoring]

  - id: arima
    name: ARIMA
    aliases: [Autoregressive Integrated Moving Average]
    branch: classical-ml
    type: model-class
    era: 1970
    status: foundational
    descriptor: Box-Jenkins model combining autoregression, differencing, and moving-average terms for stationary series.
    anchors: [supply-chain demand forecasting, financial time-series baselines]

  - id: kalman-filter
    name: Kalman Filter
    branch: classical-ml
    type: algorithm
    era: 1960
    status: foundational
    descriptor: Recursive Bayesian estimator for linear-Gaussian state-space models; optimal under those assumptions.
    anchors:
      [
        Apollo guidance computer,
        GPS receiver fusion,
        missile guidance,
        robotics sensor fusion,
      ]

  - id: particle-filter
    name: Particle Filter
    aliases: [Sequential Monte Carlo]
    branch: classical-ml
    type: algorithm
    era: 1993
    status: active
    descriptor: Sampling-based nonlinear state estimator using a set of weighted particles.
    anchors: [robot localization SLAM, target tracking in radar]

  - id: survival-analysis
    name: Survival Analysis
    branch: classical-ml
    type: framework
    era: 1958-present
    status: active
    descriptor: Modeling time-to-event data with censoring; Kaplan-Meier estimator, Cox proportional hazards.
    anchors:
      [clinical trial analysis, customer churn timing, hardware reliability]

  - id: anomaly-detection
    name: Anomaly Detection
    aliases: [Outlier Detection]
    branch: classical-ml
    type: framework
    era: 1960s-present
    status: active
    descriptor: Identifying observations deviating from expected patterns; statistical, density, distance, or model-based.
    anchors:
      [
        credit-card fraud detection,
        network intrusion detection,
        manufacturing QC,
      ]

  - id: isolation-forest
    name: Isolation Forest
    branch: classical-ml
    type: algorithm
    era: 2008
    status: active
    descriptor: Anomaly detection by recursive random partitioning; anomalies isolate with shorter average path length.
    anchors: [fraud detection systems, scikit-learn outlier detection default]

  # ==================== DEEP LEARNING ====================

  - id: deep-learning
    name: Deep Learning
    branch: deep-learning
    type: framework
    era: 2012-present
    status: active
    descriptor: Multi-layer neural networks trained end-to-end via backpropagation; the dominant paradigm since AlexNet.
    anchors: [ImageNet revolution 2012, all modern frontier AI systems]

  - id: mlp
    name: Multi-Layer Perceptron
    aliases: [MLP, Feedforward Neural Network]
    branch: deep-learning
    type: model-class
    era: 1986
    status: foundational
    descriptor: Fully-connected feedforward network with at least one hidden layer; the universal function approximator.
    anchors: [the building block embedded in every modern architecture]

  - id: cnn
    name: Convolutional Neural Networks
    aliases: [CNN, ConvNet]
    branch: deep-learning
    type: model-class
    era: 1989
    status: active
    descriptor: Networks with weight-shared local receptive fields; dominant for grid-structured data.
    anchors:
      [
        AlexNet ImageNet 2012,
        ResNet,
        early Facebook photo tagging,
        medical imaging,
      ]

  - id: rnn
    name: Recurrent Neural Networks
    aliases: [RNN]
    branch: deep-learning
    type: model-class
    era: 1980s
    status: legacy
    descriptor: Networks with cyclic connections enabling sequential processing; largely superseded by Transformers.
    anchors: [Elman networks, baseline for sequence modeling in the 2010s]

  - id: lstm
    name: Long Short-Term Memory
    aliases: [LSTM]
    branch: deep-learning
    type: model-class
    era: 1997
    status: legacy
    descriptor: Gated RNN designed to mitigate vanishing gradients via a cell state and input/forget/output gates.
    anchors: [Google Translate neural MT 2016, Siri 2014-era acoustic models]

  - id: gru
    name: Gated Recurrent Unit
    aliases: [GRU]
    branch: deep-learning
    type: model-class
    era: 2014
    status: legacy
    descriptor: Streamlined gated RNN with reset and update gates; cheaper alternative to LSTM.
    anchors: [neural MT systems mid-2010s, sequence baselines]

  - id: transformer
    name: Transformer
    branch: deep-learning
    type: model-class
    era: 2017
    status: active
    descriptor: Attention-only architecture without recurrence or convolution; foundation of all modern foundation models.
    anchors: [Attention Is All You Need 2017, GPT, BERT, Claude, Gemini, Llama]

  - id: gnn
    name: Graph Neural Networks
    aliases: [GNN]
    branch: deep-learning
    type: model-class
    era: 2016-present
    status: active
    descriptor: Neural networks that operate on graph-structured input via message passing between nodes.
    anchors:
      [
        DeepMind ETA prediction in Google Maps,
        drug-discovery models,
        fraud rings,
      ]

  - id: autoencoder
    name: Autoencoders
    branch: deep-learning
    type: model-class
    era: 1980s-present
    status: active
    descriptor: Neural networks trained to reconstruct their input through a bottleneck representation.
    anchors: [dimensionality reduction, denoising, anomaly detection]

  - id: vae
    name: Variational Autoencoders
    aliases: [VAE]
    branch: deep-learning
    type: model-class
    era: 2013
    status: active
    descriptor: Generative autoencoders with a probabilistic latent space trained via the evidence lower bound.
    anchors:
      [molecule generation in drug discovery, representation learning baseline]

  - id: gan
    name: Generative Adversarial Networks
    aliases: [GAN]
    branch: deep-learning
    type: model-class
    era: 2014
    status: legacy
    descriptor: Generator-discriminator pair trained adversarially to produce realistic samples.
    anchors: [StyleGAN photorealistic faces, deepfake era 2017-2022]

  - id: diffusion-models
    name: Diffusion Models
    branch: deep-learning
    type: model-class
    era: 2020-present
    status: active
    descriptor: Generative models that learn to reverse a gradual noising process; current state of the art for image and video.
    anchors: [Stable Diffusion, DALL-E 2/3, Midjourney, Sora]

  - id: neural-ode
    name: Neural Ordinary Differential Equations
    aliases: [Neural ODE]
    branch: deep-learning
    type: model-class
    era: 2018
    status: emerging
    descriptor: Continuous-depth networks parameterizing the derivative of the hidden state with an ODE solver.
    anchors: [continuous normalizing flows, irregular time-series modeling]

  - id: foundation-models
    name: Foundation Models
    branch: deep-learning
    type: framework
    era: 2021-present
    status: active
    descriptor: Large-scale self-supervised models trained on broad data, adapted to many downstream tasks.
    anchors: [Stanford HAI 2021 framing, GPT-3 onward, CLIP, SAM]

  - id: self-supervised-learning
    name: Self-Supervised Learning
    aliases: [SSL]
    branch: deep-learning
